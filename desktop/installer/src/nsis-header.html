<!-- NSIS page-header bitmap. Rendered at exactly 150x57, then converted to
     24-bit BMP. It sits at the right of the white header band on every wizard
     page except the first and last, so it is drawn on the wizard's own white
     (PAPER) and reads as part of the window rather than a dark patch pasted
     into it. The station's wordmark, if it has one; otherwise icon + name. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 150px; height: 57px; overflow: hidden; }
  body {
    position: relative;
    background: {{PAPER}};
    font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Explicit pixel widths: see the note in nsis-sidebar.html. */
  .row { position: absolute; left: 0; top: 0; width: 150px; height: 57px; display: flex; align-items: center; justify-content: flex-end; }
  img.logo.has-logo { width: 122px; height: auto; margin-right: 12px; }
  img.logo.no-logo { width: 32px; height: 32px; border-radius: 7px; margin-right: 8px; }
  .name { display: none; font-size: 13px; font-weight: 600; color: #231a15; margin-right: 12px; white-space: nowrap; }
  .no-logo + .name { display: block; }
</style>

<div class="row">
  <img class="logo {{LOGO_CLASS}}" src="{{LOGO_DATA_URI}}" alt="">
  <div class="name">{{NAME}}</div>
</div>
